<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaBlooms GitHub Pages Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#17315a,#08101d 55%,#05080d);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f7fbff;padding:24px}
main{max-width:760px;width:100%;border:1px solid #31527a;border-radius:24px;background:rgba(15,25,40,.92);padding:36px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.ok{font-size:clamp(2.2rem,8vw,5rem);margin:0 0 8px}h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px}
p{font-size:1.1rem;line-height:1.55;color:#bfd0e4}strong{color:#7ee7ff}
code{display:block;margin-top:18px;padding:14px;border-radius:12px;background:#08111f;color:#a8ffd8;word-break:break-all}
</style>
</head>
<body>
<main>
<div class="ok">✅</div>
<h1>GitHub Pages works.</h1>
<p>If you can see this page on an LISD device/network, then <strong>github.io is not blocked</strong> and GitHub Pages is viable for the classroom hub.</p>
<p>This is only a network-access test. It contains no student data and does not replace the current Google Apps Script hub.</p>
<code id="stamp"></code>
</main>
<script>document.getElementById('stamp').textContent='MetaBlooms network test · loaded '+new Date().toLocaleString();</script>
</body>
</html>
